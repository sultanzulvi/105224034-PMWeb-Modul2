<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Sketsa Wireframe Semantik - AnonPulse</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #1e293b;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 25px;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: row;
      gap: 30px;
      align-items: flex-start;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    svg {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fafafa;
    }
  </style>
</head>
<body>

  <h1>Sketsa Tampilan Produk AnonPulse (Semantik HTML5)</h1>

  <div class="container">
    <!-- SKETSA DESKTOP -->
    <div>
      <h3 style="text-align: center; margin-top:0;">Tampilan Desktop</h3>
      <svg width="600" height="740" viewBox="0 0 600 740" xmlns="http://www.w3.org/2000/svg">
        <style>
          .tag { font-family: monospace; font-size: 11px; fill: #d97706; font-weight: bold; }
          .title { font-weight: bold; font-size: 14px; fill: #0f172a; }
          .desc { font-size: 12px; fill: #475569; }
          .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
          .solid-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
          .btn { fill: #2563eb; rx: 4; }
          .btn-text { fill: white; font-weight: bold; font-size: 12px; text-anchor: middle; }
        </style>

        <!-- HEADER -->
        <rect x="20" y="20" width="560" height="60" class="box" />
        <text x="30" y="38" class="tag">&lt;header&gt;</text>
        <text x="40" y="60" class="title">🔒 AnonPulse</text>
        
        <!-- NAV -->
        <rect x="360" y="32" width="200" height="36" class="box" />
        <text x="365" y="46" class="tag">&lt;nav&gt;</text>
        <text x="380" y="58" class="desc">Beranda | Survei | Dasbor</text>

        <!-- MAIN -->
        <rect x="20" y="95" width="560" height="570" class="box" stroke="#2563eb" />
        <text x="30" y="113" class="tag" style="fill: #2563eb;">&lt;main&gt;</text>

        <!-- SECTION: HERO -->
        <rect x="40" y="125" width="520" height="90" class="solid-box" />
        <text x="50" y="143" class="tag">&lt;section&gt; (Hero)</text>
        <text x="50" y="170" class="title">&lt;h1&gt; Suarakan Pendapat Tanpa Khawatir Terlacak</text>
        <text x="50" y="193" class="desc">&lt;p&gt; Dilindungi Kriptografi Differential Privacy & Enkripsi Homomorfik.</text>

        <!-- SECTION: FORM -->
        <rect x="40" y="230" width="520" height="415" class="solid-box" />
        <text x="50" y="248" class="tag">&lt;section&gt; &lt;form&gt;</text>
        <text x="50" y="275" class="title">&lt;h2&gt; Kuesioner Evaluasi Kampus</text>

        <!-- ARTICLE 1 -->
        <rect x="60" y="295" width="480" height="85" class="box" />
        <text x="70" y="313" class="tag">&lt;article&gt;</text>
        <text x="70" y="335" class="desc">&lt;label&gt; 1. Apakah beban kuliah semester ini memicu stres?</text>
        <!-- Radio Buttons -->
        <circle cx="85" cy="355" r="6" stroke="#64748b" stroke-width="1.5" fill="none" />
        <text x="100" y="360" class="desc">Ya</text>
        <circle cx="160" cy="355" r="6" stroke="#64748b" stroke-width="1.5" fill="none" />
        <text x="175" y="360" class="desc">Tidak</text>

        <!-- ARTICLE 2 -->
        <rect x="60" y="395" width="480" height="85" class="box" />
        <text x="70" y="413" class="tag">&lt;article&gt;</text>
        <text x="70" y="435" class="desc">&lt;label for="skor"&gt; 2. Skala tingkat stres (1 - 10):</text>
        <!-- Range input -->
        <line x1="80" y1="458" x2="380" y2="458" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
        <circle cx="230" cy="458" r="8" fill="#2563eb" />
        <text x="400" y="462" class="desc">&lt;input type="range"&gt; (6/10)</text>

        <!-- ASIDE -->
        <rect x="60" y="495" width="480" height="65" class="box" stroke="#16a34a" />
        <text x="70" y="513" class="tag" style="fill:#16a34a;">&lt;aside&gt; (Status Siber & Kripto)</text>
        <text x="70" y="535" class="desc">🛡️ Enkripsi Berjalan di Browser | Metadata IP Dibuang Otomatis</text>
        <text x="70" y="550" class="desc" style="font-size:10px; fill:#64748b;">Proof-of-Work: Hash Solved (0.2s)</text>

        <!-- BUTTON -->
        <rect x="180" y="580" width="240" height="42" class="btn" />
        <text x="300" y="606" class="btn-text">&lt;button type="submit"&gt; Enkripsi & Kirim</text>

        <!-- FOOTER -->
        <rect x="20" y="680" width="560" height="40" class="box" />
        <text x="30" y="698" class="tag">&lt;footer&gt;</text>
        <text x="210" y="705" class="desc">&copy; 2026 AnonPulse. All Rights Reserved.</text>
      </svg>
    </div>

    <!-- SKETSA MOBILE -->
    <div>
      <h3 style="text-align: center; margin-top:0;">Tampilan Mobile</h3>
      <svg width="280" height="740" viewBox="0 0 280 740" xmlns="http://www.w3.org/2000/svg">
        <style>
          .tag-m { font-family: monospace; font-size: 9px; fill: #d97706; font-weight: bold; }
          .title-m { font-weight: bold; font-size: 11px; fill: #0f172a; }
          .desc-m { font-size: 9.5px; fill: #475569; }
        </style>

        <!-- HEADER -->
        <rect x="10" y="20" width="260" height="50" class="box" />
        <text x="18" y="35" class="tag-m">&lt;header&gt;</text>
        <text x="20" y="54" class="title-m">🔒 AnonPulse</text>
        <text x="235" y="54" class="title-m">☰</text>

        <!-- MAIN -->
        <rect x="10" y="80" width="260" height="595" class="box" stroke="#2563eb" />
        <text x="18" y="96" class="tag-m" style="fill: #2563eb;">&lt;main&gt;</text>

        <!-- SECTION: HERO -->
        <rect x="20" y="105" width="240" height="70" class="solid-box" />
        <text x="26" y="120" class="tag-m">&lt;section&gt;</text>
        <text x="26" y="140" class="title-m">&lt;h1&gt; Suarakan Pendapat</text>
        <text x="26" y="160" class="desc-m">&lt;p&gt; Bebas Jejak & Terenkripsi.</text>

        <!-- SECTION: FORM -->
        <rect x="20" y="185" width="240" height="475" class="solid-box" />
        <text x="26" y="200" class="tag-m">&lt;section&gt; &lt;form&gt;</text>
        <text x="26" y="222" class="title-m">&lt;h2&gt; Kuesioner Kampus</text>

        <!-- ARTICLE 1 -->
        <rect x="30" y="235" width="220" height="85" class="box" />
        <text x="36" y="250" class="tag-m">&lt;article&gt;</text>
        <text x="36" y="270" class="desc-m">&lt;label&gt; 1. Beban kuliah memicu stres?</text>
        <circle cx="48" cy="295" r="5" stroke="#64748b" fill="none" />
        <text x="60" y="298" class="desc-m">Ya</text>
        <circle cx="105" cy="295" r="5" stroke="#64748b" fill="none" />
        <text x="117" y="298" class="desc-m">Tidak</text>

        <!-- ARTICLE 2 -->
        <rect x="30" y="330" width="220" height="85" class="box" />
        <text x="36" y="345" class="tag-m">&lt;article&gt;</text>
        <text x="36" y="365" class="desc-m">&lt;label for="skor-m"&gt; 2. Skala stres (1-10):</text>
        <line x1="45" y1="390" x2="190" y2="390" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
        <circle cx="130" cy="390" r="7" fill="#2563eb" />

        <!-- ASIDE -->
        <rect x="30" y="425" width="220" height="75" class="box" stroke="#16a34a" />
        <text x="36" y="440" class="tag-m" style="fill:#16a34a;">&lt;aside&gt;</text>
        <text x="36" y="460" class="desc-m">🛡️ Enkripsi Browser Aktif</text>
        <text x="36" y="475" class="desc-m">Metadata IP Dibuang</text>
        <text x="36" y="490" class="desc-m" style="font-size:8px; fill:#64748b;">PoW Solved</text>

        <!-- BUTTON -->
        <rect x="40" y="525" width="200" height="38" class="btn" />
        <text x="140" y="548" class="btn-text" style="font-size:10px;">&lt;button&gt; Enkripsi & Kirim</text>

        <!-- FOOTER -->
        <rect x="10" y="690" width="260" height="35" class="box" />
        <text x="18" y="705" class="tag-m">&lt;footer&gt;</text>
        <text x="80" y="712" class="desc-m">&copy; 2026 AnonPulse</text>
      </svg>
    </div>
  </div>

</body>
</html>
